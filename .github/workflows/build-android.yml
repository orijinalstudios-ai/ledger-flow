name: Build Android APK (LedgerFlow)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Distribution & Sync Capacitor
        run: |
          node build.js
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: LedgerFlow Android ${{ github.ref_name }}
          body: |
            ### 📱 LedgerFlow Native Android APK Release
            Download and install `app-debug.apk` directly on any Android device!
            
            **Features Included:**
            - Native Android APK package with offline-first support
            - Cloud Firestore sync & Firebase Authentication
            - Native Excel (.xlsx) statement export with Android Share Sheet
            - Hardware back-button navigation & modal dismissal
            - Dark emerald theme & Material Symbols
          draft: false
          prerelease: false
