name: Build Android APK (Ledger Flow)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Distribution & Sync Capacitor
        run: |
          node build.js
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Prepare Clean Output Directory
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/ledger_flow.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledger_flow
          path: build-output/ledger_flow.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          files: build-output/ledger_flow.apk
          tag_name: latest
          name: "Ledger Flow Latest Release"
          body: |
            ### 📱 Ledger Flow Android APK
            Download **ledger_flow.apk** below to install the latest version on your Android phone!
            
            **Highlights & Features:**
            - Native Android APK (`ledger_flow.apk`) with offline-first speed
            - Clean branded Ledger Flow splash screen
            - Automatic in-app update notifications for future releases
            - Cloud Firestore sync & Firebase Authentication
            - Native Excel (.xlsx) statement export with Android Share Sheet
            - Gesture & hardware back-button navigation
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
